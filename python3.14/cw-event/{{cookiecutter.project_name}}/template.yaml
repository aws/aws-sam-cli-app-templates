AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  {{ cookiecutter.project_name }}

  Sample SAM Template for {{ cookiecutter.project_name }}

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  ScheduledEventLoggerFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      Description: A Lambda function that logs the payload received from a scheduled event.
      CodeUri: scheduled_event_logger/
      Handler: app.lambda_handler
      Runtime: {{ cookiecutter.runtime }}
      {%- if cookiecutter.architectures.value != []%}
      Architectures:
      {%- for arch in cookiecutter.architectures.value %}
        - {{arch}}
      {%- endfor %}
      {%- endif %}
      MemorySize: 128
      Events:
        ScheduledEvent:
          Type: Schedule # More info about Schedule Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#schedule
          Properties:
            # This example runs every hour.
            Schedule: cron(0 * * * ? *)

Outputs:
  ScheduledEventLoggerFunction:
    Description: "Scheduled Event Logger Lambda Function ARN"
    Value: !GetAtt ScheduledEventLoggerFunction.Arn
  ScheduledEventLoggerFunctionIamRole:
    Description: "Implicit IAM Role created for Scheduled Event Logger function"
    Value: !GetAtt ScheduledEventLoggerFunctionRole.Arn
